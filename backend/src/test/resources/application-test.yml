spring:
  datasource:
    # ${random.uuid} is resolved ONCE per context creation — identical @SpringBootTest configurations share the
    # same cached context (and the same DB URL), while differently-configured contexts each get their own fresh
    # H2 instance. This prevents Liquibase from colliding when multiple distinct context configurations exist.
    url: jdbc:h2:mem:payroll_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true

wagepayroll:
  demo:
    auto-initialize-catalog: false

app:
  cors:
    allowed-origin-patterns: http://localhost:3007,http://auth.lvh.me:3007,http://demo.lvh.me:3007,http://*.lvh.me:3007,http://*.lvh.me:3108
  invitation:
    expose-plain-token: true
  storage:
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: test
      secret-key: test
      bucket: wage-documents-test
      verify-object-before-complete: false
      delete-object-on-soft-delete: true
      orphan-cleanup:
        enabled: false
  billing:
    stripe:
      webhook-secret: whsec_test_secret
      # Non-empty placeholder so hosted-checkout paths run; real Stripe calls return 502 unless key is valid test mode.
      secret-key: sk_test_00000000000000000000000000000000
      # Allows http://localhost, http://127.0.0.1, and http://*.lvh.me redirect URLs for Stripe/PayPal billing (see BillingRedirectUrlPolicy).
      allow-insecure-checkout-urls: true
    paypal:
      webhook-id: test_paypal_webhook_id_1
      verify-signature: false
    usage-aggregation:
      scheduled-enabled: false
