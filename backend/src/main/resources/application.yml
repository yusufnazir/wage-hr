server:
  port: ${SERVER_PORT:8300}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: wage-payroll-api
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://127.0.0.1:3307/wagepayroll}
    username: ${DATABASE_USERNAME:wage}
    password: ${DATABASE_PASSWORD:wage}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  public:
    frontend-origin: ${PUBLIC_FRONTEND_ORIGIN:http://auth.lvh.me:3007}
  host:
    base-domain: ${BASE_DOMAIN:lvh.me}
    auth-subdomain: ${AUTH_SUBDOMAIN:auth}
    app-subdomain: ${APP_SUBDOMAIN:app}
    cookie-domain: ${COOKIE_DOMAIN:.lvh.me}
    reserved-subdomains-extra: ${RESERVED_SUBDOMAINS_EXTRA:}
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:3007,http://127.0.0.1:3007,http://auth.lvh.me:3007,http://app.lvh.me:3007,http://*.lvh.me:3007,http://auth.lvh.me:3108,http://app.lvh.me:3108,http://*.lvh.me:3108}
  security:
    rate-limit:
      login-max-attempts: ${LOGIN_RATE_MAX:5}
      login-window-minutes: ${LOGIN_RATE_WINDOW_MINUTES:15}
      forgot-password-max-attempts: ${FORGOT_RATE_MAX:5}
      forgot-password-window-minutes: ${FORGOT_RATE_WINDOW_MINUTES:60}
    headers:
      content-security-policy: "default-src 'none'; frame-ancestors 'none'"
      referrer-policy: strict-origin-when-cross-origin
      permissions-policy: "geolocation=(), microphone=(), camera=()"
  forwarding:
    trust-proxy: ${TRUST_PROXY:false}
  invitation:
    expose-plain-token: ${APP_INVITATION_EXPOSE_PLAIN_TOKEN:false}
  billing:
    stripe:
      # Secret API key (sk_live_… / sk_test_…). Required for tenant checkout + billing portal; empty → 503 on those routes.
      secret-key: ${STRIPE_SECRET_KEY:}
      # Webhook signing secret from Stripe Dashboard (whsec_…). Empty disables POST /billing/webhooks/stripe (503).
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # When false, success/cancel/return URLs must use https for Stripe + PayPal billing redirects. When true, http is allowed only for localhost, 127.0.0.1, and *.lvh.me (local multi-tenant dev / Playwright — not for production).
      allow-insecure-checkout-urls: ${STRIPE_ALLOW_INSECURE_CHECKOUT_URLS:false}
    paypal:
      # Webhook id from PayPal Developer dashboard (used when JSON includes webhook_id). Empty disables POST /billing/webhooks/paypal (503).
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      # REST API host (no trailing slash). Sandbox default; production: https://api-m.paypal.com
      api-base: ${PAYPAL_API_BASE:https://api-m.sandbox.paypal.com}
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      # When true, POST /billing/webhooks/paypal calls PayPal verify-webhook-signature (needs transmission headers + PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET). 503 if verify on but credentials missing.
      verify-signature: ${PAYPAL_WEBHOOK_VERIFY:false}
    usage-aggregation:
      # Recompute billing_usage_aggregate for the previous UTC day (tenants with events only). Disable for tests.
      scheduled-enabled: ${BILLING_USAGE_AGGREGATION_SCHEDULED:true}
      # 6-field cron, zone UTC — default 02:15:00 UTC daily.
      daily-cron: ${BILLING_USAGE_AGGREGATION_CRON:0 15 2 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
